<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manasa - Student Profile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 20px;
    }

    .profile-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 25px;
      padding: 35px 28px;
      text-align: center;
      box-shadow:
        12px 12px 25px #d9d9d9,
        -12px -12px 25px #ffffff;
    }

    .profile-icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      color: #555555;
      background: #ffffff;
      box-shadow:
        inset 7px 7px 14px #d9d9d9,
        inset -7px -7px 14px #ffffff;
    }

    h1 {
      color: #333333;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .designation {
      color: #777777;
      font-size: 16px;
      margin-bottom: 28px;
    }

    .interests-title {
      color: #444444;
      font-size: 18px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .interest {
      padding: 12px 18px;
      border-radius: 15px;
      color: #555555;
      font-size: 14px;
      background: #ffffff;
      box-shadow:
        6px 6px 12px #d9d9d9,
        -6px -6px 12px #ffffff;
    }

    .interest:active {
      box-shadow:
        inset 5px 5px 10px #d9d9d9,
        inset -5px -5px 10px #ffffff;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <div class="profile-icon">M</div>

    <h1>Manasa</h1>
    <p class="designation">Student</p>

    <div class="interests-title">My Interests</div>

    <div class="interests">
      <div class="interest">Exercise</div>
      <div class="interest">Cooking</div>
      <div class="interest">Listening</div>
      <div class="interest">Music</div>
    </div>
  </div>

</body>
</html>
